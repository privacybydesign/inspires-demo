services:
  app:
    # The PHP version lives in one place: the PHP_TAG default in the Dockerfile.
    # Passing it as a build arg here would override that default and hide the fix.
    build:
      context: .
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      CANARY_URL: "https://tls-canary:8443/"
    depends_on:
      - tls-canary

  # Local stand-in for a host whose cert chains to the distrusted CA.
  # Lets the eMudhra check run fully offline — nothing leaves the laptop.
  tls-canary:
    build: ./tls-canary
    expose:
      - "8443"
    volumes:
      - ./ca:/ca:ro
